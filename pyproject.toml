[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "eliapplybot"
version = "0.1.0"
description = "Local-first review-first Python assistant for job application forms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.2",
  "fastapi>=0.111",
  "jinja2>=3.1",
  "playwright>=1.45",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
eliapplybot = "eliapplybot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eliapplybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
